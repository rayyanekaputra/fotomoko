<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>fotomoko</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Iosevka+Charon:wght@400;700&family=Khand&family=Inter:wght@500&family=IBM+Plex+Mono:wght@400;500;700&family=Just+Me+Again+Down+Here&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: 'Manrope', system-ui, sans-serif;
      background: #1e1e1e;
      color: #f5f2ea;
      display: grid;
      grid-template-columns: 300px 1fr;
      height: 100dvh;
    }
    aside {
      padding: 16px;
      overflow-y: auto;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h1 { font-size: 20px; margin: 0; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: #999; margin: 0 0 8px; }
    section, #fields { display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
    .row[hidden] { display: none; }
    select, input[type="text"], button {
      font: inherit;
      font-size: 14px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #2a2a2a;
      color: inherit;
    }
    button { cursor: pointer; background: #f5f2ea; color: #1e1e1e; border: none; font-weight: 700; }
    button.secondary { background: #2a2a2a; color: inherit; border: 1px solid #444; font-weight: 600; }
    button:disabled { opacity: 0.5; cursor: default; }
    input[type="file"] { font-size: 13px; }
    #export-note { font-size: 12px; color: #f2c94c; min-height: 1em; margin: 0; }
    main { display: flex; padding: 24px; min-width: 0; min-height: 0; }
    #preview-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; }
    #preview { display: block; box-shadow: 0 6px 30px rgba(0, 0, 0, 0.5); }

    @media (max-width: 700px) {
      body { grid-template-columns: 1fr; grid-template-rows: 55dvh auto; height: auto; }
      main { order: -1; height: 55dvh; padding: 12px; }
      aside { border-right: none; border-top: 1px solid #333; }
    }
  </style>
</head>
<body>
  <aside>
    <h1>fotomoko</h1>

    <section>
      <h2>Template</h2>
      <select id="template-select" aria-label="Template"></select>
    </section>

    <section>
      <h2>Photos</h2>
      <input id="photo-input" type="file" accept="image/*" multiple aria-label="Load photos">
      <button id="sample-btn" class="secondary" type="button">Use sample photos</button>
    </section>

    <section>
      <h2>Text</h2>
      <div id="fields"></div>
    </section>

    <section>
      <h2>Export</h2>
      <label class="row">
        <span>Format</span>
        <select id="format-select">
          <option value="native">Template only</option>
          <option value="story">Story 9:16</option>
          <option value="square">Square 1:1</option>
        </select>
      </label>
      <label class="row" id="background-row">
        <span>Background</span>
        <select id="background-select">
          <option value="light">Broken white</option>
          <option value="dark">Dark grey</option>
        </select>
      </label>
      <label class="row">
        <span>Size</span>
        <select id="scale-select">
          <option value="1">1×</option>
          <option value="2">2×</option>
          <option value="3" selected>3×</option>
          <option value="4">4×</option>
        </select>
      </label>
      <p id="export-note"></p>
      <button id="download-btn" type="button">Download PNG</button>
    </section>
  </aside>

  <main>
    <div id="preview-wrap">
      <canvas id="preview"></canvas>
    </div>
  </main>

  <script type="module" src="main.mjs"></script>
</body>
</html>
